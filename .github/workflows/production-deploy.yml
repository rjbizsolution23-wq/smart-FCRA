name: SmartFCRA Supreme — Continuous Integration & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run unit + API tests
        run: npm run test:all

      - name: Build + verify SPA
        run: |
          npm run build
          test -f dist/static/app.js
          node --check dist/static/app.js
          echo "static app.js OK ($(wc -c < dist/static/app.js) bytes)"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Reset local D1 + seed
        run: npm run db:reset

      - name: Write local secrets for preview
        run: cp .dev.vars.example .dev.vars

      - name: E2E security tests
        run: |
          npm run preview &
          PREVIEW_PID=$!
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo "preview ready"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health || (kill $PREVIEW_PID 2>/dev/null; exit 1)
          npx playwright test tests/multi-tenant-isolation.spec.ts
          kill $PREVIEW_PID 2>/dev/null || true

  deploy-to-cloudflare:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify SPA bundle
        run: |
          test -f dist/static/app.js
          node --check dist/static/app.js
          echo "static app.js OK ($(wc -c < dist/static/app.js) bytes)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v2 SEPARATE PROJECT — never deploy this branch/copy to original smart-fcra
          command: pages deploy dist --project-name=smart-fcra-v2
