name: SmartFCRA Supreme — Continuous Integration & Deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-smart-fcra-v2 to authorize the production release'
        required: true
        type: string

concurrency:
  group: smart-fcra-v2-production
  cancel-in-progress: false

jobs:
  validate-and-test:
    if: github.event.inputs.confirmation == 'deploy-smart-fcra-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run unit + API tests
        run: npm run test:all

      - name: Build + verify SPA
        run: |
          npm run build
          test -f dist/static/app.js
          node --check dist/static/app.js
          echo "static app.js OK ($(wc -c < dist/static/app.js) bytes)"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Reset local D1 + seed
        run: npm run db:reset

      - name: Write local secrets for preview
        run: cp .dev.vars.example .dev.vars

      - name: E2E security tests
        run: |
          npm run preview &
          PREVIEW_PID=$!
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo "preview ready"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health || (kill $PREVIEW_PID 2>/dev/null; exit 1)
          npx playwright test tests/multi-tenant-isolation.spec.ts
          kill $PREVIEW_PID 2>/dev/null || true

  deploy-to-cloudflare:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirmation == 'deploy-smart-fcra-v2'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify SPA bundle
        run: |
          test -f dist/static/app.js
          node --check dist/static/app.js
          echo "static app.js OK ($(wc -c < dist/static/app.js) bytes)"

      - name: Require Cloudflare Pages secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$BACKUP_BUCKET" ]; then
            echo "::error::Production deploy requires CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and repository variable D1_BACKUP_BUCKET."
            exit 1
          fi

      - name: Back up production D1 to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p .backups
          TS="$(date -u +%Y%m%d-%H%M%S)"
          FILE=".backups/pre_release_${GITHUB_SHA}_${TS}.sql"
          KEY="backups/d1/pre-release/${GITHUB_SHA}_${TS}.sql"
          npx wrangler d1 export fcra-detector-v2 --remote --output="$FILE"
          npx wrangler r2 object put "${D1_BACKUP_BUCKET}/${KEY}" --file="$FILE" --remote
          rm -f "$FILE"

      - name: Apply D1 migrations (remote production)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fcra-detector-v2 --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v2 SEPARATE PROJECT — never deploy this branch/copy to original smart-fcra
          command: pages deploy dist --project-name=smart-fcra-v2

      - name: Verify production readiness
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://smart-fcra-v2.pages.dev/api/health/ready
