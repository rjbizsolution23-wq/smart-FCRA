name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + API tests
        run: npm run test:all

      - name: Parser score tests
        run: npx tsx tests/parser-scores.test.mjs

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Reset local D1 + seed
        run: npm run db:reset

      - name: Write local secrets for preview
        run: cp .dev.vars.example .dev.vars

      - name: E2E security tests
        run: |
          npm run build
          npm run preview &
          PREVIEW_PID=$!
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health; then
              echo "preview ready"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health || (kill $PREVIEW_PID 2>/dev/null; exit 1)
          npx playwright test tests/multi-tenant-isolation.spec.ts
          kill $PREVIEW_PID 2>/dev/null || true
