name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + API tests
        run: npm run test:all

      - name: Parser score tests
        run: npx tsx tests/parser-scores.test.mjs

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Reset local D1 + seed
        run: npm run db:reset

      - name: E2E security tests
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          npx playwright test tests/multi-tenant-isolation.spec.ts
