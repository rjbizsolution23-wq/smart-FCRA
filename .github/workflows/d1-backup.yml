name: Smart FCRA v2 — D1 Database Backup

on:
  schedule:
    # Weekly Sunday 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  backup-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export D1 (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x scripts/backup-database.sh
          mkdir -p .backups
          npx wrangler d1 export fcra-detector-v2 --remote --output=".backups/ci_backup_$(date -u +%Y%m%d-%H%M%S).sql"

      - name: Replicate backup to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_BUCKET: ${{ vars.D1_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$D1_BACKUP_BUCKET" ]; then
            echo "::error::Set repository variable D1_BACKUP_BUCKET to a private, backup-only R2 bucket."
            exit 1
          fi
          LATEST=$(ls -t .backups/*.sql | head -1)
          KEY="backups/d1/ci_backup_$(date -u +%Y%m%d-%H%M%S).sql"
          npx wrangler r2 object put "${D1_BACKUP_BUCKET}/${KEY}" --file="$LATEST" --remote

      - name: Remove runner backup copy
        if: always()
        run: rm -f .backups/*.sql
