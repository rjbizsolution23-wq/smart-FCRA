name: Smart FCRA v2 — PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Copy static assets
        run: mkdir -p dist/static && cp -r public/static/* dist/static/

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=smart-fcra-v2

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Smart FCRA v2 Preview\n\nPR #${{ github.event.pull_request.number }} deployed to Cloudflare Pages.\n\n**Branch alias:** \`pr-${{ github.event.pull_request.number }}\`\n\nVerify:\n- Health: https://pr-${{ github.event.pull_request.number }}.smart-fcra-v2.pages.dev/api/health\n- API docs: https://pr-${{ github.event.pull_request.number }}.smart-fcra-v2.pages.dev/api/docs\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
