name: Hotfix Deploy (blank-screen / SPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/static/app.js'
      - 'src/index.tsx'
      - 'scripts/embed-spa.mjs'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify SPA
        run: |
          node --check dist/static/app.js
          test -f dist/_worker.js
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=smart-fcra-v2
