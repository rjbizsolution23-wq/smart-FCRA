name: Smart FCRA v2 — Ops Daily Client + CRO

# Daily pack: morning ritual, enterprise comms, streak nudge, inactive re-engage,
# bureau follow-up, privacy SLA, email health.
# Staggered after dedicated morning ritual (13:00) — this pack at 14:30 UTC.
# Requires: JOURNEY_CRON_SECRET (or MAILING_WEBHOOK_SECRET), optional APP_BASE_URL.

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      org_id:
        description: 'Optional org ID scope'
        required: false
        default: ''

jobs:
  ops-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch daily ops pack
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          JOURNEY_CRON_SECRET: ${{ secrets.JOURNEY_CRON_SECRET }}
          MAILING_WEBHOOK_SECRET: ${{ secrets.MAILING_WEBHOOK_SECRET }}
          ORG_ID: ${{ github.event.inputs.org_id || '' }}
        run: |
          set -euo pipefail
          BASE="${APP_BASE_URL:-https://smart-fcra-v2.pages.dev}"
          SECRET="${JOURNEY_CRON_SECRET:-${MAILING_WEBHOOK_SECRET:-}}"
          if [ -z "$SECRET" ]; then
            echo "::error::JOURNEY_CRON_SECRET (or MAILING_WEBHOOK_SECRET) is not configured."
            exit 1
          fi
          if [ -n "$ORG_ID" ]; then
            PAYLOAD="{\"pack\":\"daily\",\"orgId\":\"${ORG_ID}\"}"
          else
            PAYLOAD='{"pack":"daily"}'
          fi
          echo "Ops daily → ${BASE%/}/api/cron/ops"
          curl -fsS -X POST "${BASE%/}/api/cron/ops" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${SECRET}" \
            -d "${PAYLOAD}"
