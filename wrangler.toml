name = "smart-fcra-v2"
compatibility_date = "2026-04-13"
pages_build_output_dir = "./dist"
compatibility_flags = ["nodejs_compat"]

# SEPARATE PROJECT — create DB with: npx wrangler d1 create fcra-detector-v2
[[d1_databases]]
binding = "DB"
database_name = "fcra-detector-v2"
database_id = "ae28993e-1c98-4f4e-a73d-42ae4337424d"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "smart-fcra-v2-docs"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e26124f39fef402aa0f118d5121b7a2e"
preview_id = "7ac5ef480f90489ea0dbdbffb613a231"

[ai]
binding = "AI"

# Local/dev defaults — OVERRIDE via `wrangler secret put` in production.
# Never ship real Stripe/Resend/Click2Mail secrets in git.
# Do NOT put [vars] here — `wrangler pages deploy` overwrites Pages production env_vars.
# Local defaults live in gitignored `.dev.vars` only.
