name = "smart-fcra-v2"
compatibility_date = "2026-04-13"
pages_build_output_dir = "./dist"
compatibility_flags = ["nodejs_compat"]

# SEPARATE PROJECT — do not reuse production smart-fcra / fcra-detector-production.
# After creating the DB: npx wrangler d1 create fcra-detector-v2
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "fcra-detector-v2"
database_id = "00000000-0000-0000-0000-000000000002"

[ai]
binding = "AI"
