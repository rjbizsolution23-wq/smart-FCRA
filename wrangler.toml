name = "smart-fcra-v2"
compatibility_date = "2026-04-13"
pages_build_output_dir = "./dist"
compatibility_flags = ["nodejs_compat"]

# SEPARATE PROJECT — create DB with: npx wrangler d1 create fcra-detector-v2
[[d1_databases]]
binding = "DB"
database_name = "fcra-detector-v2"
database_id = "00000000-0000-0000-0000-000000000002"

[ai]
binding = "AI"

# Local/dev defaults — OVERRIDE via `wrangler secret put` in production.
# Never ship real Stripe/Resend/Click2Mail secrets in git.
[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:3000"
PII_ENCRYPTION_KEY = "local-dev-only-pii-key-change-in-production-32+"
MAILING_WEBHOOK_SECRET = "local-dev-mailing-webhook-secret-change-me"
